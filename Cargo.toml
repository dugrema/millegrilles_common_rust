[package]
name = "millegrilles_common_rust"
version = "2026.4.11"
edition = "2024"

[dependencies]

# Cryptography module
# millegrilles_cryptographie = { git = "https://github.com/dugrema/millegrilles_cryptographie.git", tag = "2026.0-release", features = ["chiffrage"] }
millegrilles_cryptographie = { git = "https://github.com/dugrema/millegrilles_cryptographie.git", branch = "master", features = ["chiffrage"] }

# Asynchronous utilities
async-std = "1.12"
async-tar = { version = "0.5" }
bytes = { version = "1.11.1" }
# log = { version = "0.4" }
# env_logger = { version = "0.11" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
num-traits = "0.2.19"
rand = "0.9.2"
reqwest = { version = "0.12.28", features = ["default-tls", "native-tls", "rustls-tls", "rustls-tls-manual-roots", "json", "multipart", "stream", "socks", "cookies"] }
tempfile = { version = "3.10" }
flate2 = { version = "1.1.9" }
xz2 = { version = "0.1", features = ["tokio"] }
hex = { version = "0.4.3" }
async-compression = { version = "0.4.19", features = ["tokio", "all-algorithms"] }
fs2 = { version = "0.4.3" }

# Tokio and async primitives
async-trait = { version = "0.1.89" }
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.18" }
tokio-util = { version = "0.7.18", features = ["codec", "io"] }
static_cell = { version = "2.1.1" }

# Crypto & certificate handling
openssl = { version = "0.10.76", features = ["vendored"] }
x509-parser = { version = "0.18.0" }
multibase = { version = "0.9.2" }
multicodec = { version = "0.1.0" }
multihash = { version = "0.15.0" }
base64 = { version = "0.22.1" }
base64-url = { version = "3.0.3" }
blake2 = { version = "0.10.6" }
chacha20poly1305 = { version = "0.10.1" }
dryoc = { version = "0.7.2" }
zeroize = { version = "1.8.2", default-features = false }

# JSON serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_with = "3.22.0"
serde_json = { version = "1.0.149" }
serde-helpers = { version = "0.1.0", features = ["serde_json"] }

# Common formats
chrono = { version = "0.4.44", features = ["serde", "alloc"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.23.0", features = ["serde", "v4"] }
substring = { version = "1.4.5" }

# MongoDB
# mongodb = { version = "2.8.2", default-features = false, features = ["tokio-runtime", "bson-chrono-0_4"] }
mongodb = { version = "3.8.2", default-features = true, features = ["bson-3"] }
bson = { version = "3.1.0", features = ["chrono-0_4"] }

# RabbitMQ
lapin = { version = "4.10.0" }
futures = { version = "0.3.32" }
futures-util = { version = "0.3.32" }
tokio-amqp = { version = "2.0" }

redis = { version = "0.32.7", features = ["tokio-comp", "tokio-native-tls-comp"] }
# jwt = { version = "0.16.0", features = ["openssl"] }
jwt-simple = "0.11.9"
